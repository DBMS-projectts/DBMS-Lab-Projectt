spring.application.name=library-management
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lims_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configure secrets through environment variables; never commit real credentials.

# AI assistant (set AI_API_KEY as an environment variable; never commit a real key).
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:claude-haiku-5-5}
